services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongo-data-new:/data/db
    networks:
      - jstwotier
    ports:
      - "27017:27017"
  jsapp:
    build:
      context: .
    container_name: jsapp
    environment:
      CLOUD_KEY: ${CLOUD_KEY}
      CLOUD_NAME: ${CLOUD_NAME}
      CLOUD_SECRET: ${CLOUD_SECRET}
      MONGO_URI: mongodb://mongodb:27017/mydatabase
      ORIGIN: http://localhost:5173
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - jstwotier
    ports:
      - "5001:5000"
    depends_on:
      - mongodb

volumes:
  mongo-data-new:

networks:
  jstwotier:
